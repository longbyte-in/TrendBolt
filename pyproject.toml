[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trendbolt-mcp"
version = "0.1.0"
description = "TrendBolt MCP server and tools"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "asyncpraw>=7.7",
    "openai>=1.35",
    "azure-storage-blob>=12.20",
    "httpx>=0.27",
    "tenacity>=9.0",
    "click>=8.0",
    "mcp>=1.0.0",
    "cryptography>=41.0.0",
]

[project.scripts]
trendbolt = "trendbolt_mcp.cli:trendbolt"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP", "B"]
ignore = []

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "mypy>=1.10",
    "ruff>=0.5",
    "black>=24.4",
]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"


