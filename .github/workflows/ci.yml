name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -U pip
          pip install -e .[dev]
      - name: Lint (ruff)
        run: |
          . .venv/bin/activate
          ruff check .
      - name: Format check (black)
        run: |
          . .venv/bin/activate
          black --check .
      - name: Type check (mypy)
        run: |
          . .venv/bin/activate
          mypy trendbolt_mcp
      - name: Tests (pytest)
        run: |
          . .venv/bin/activate
          pytest -q


